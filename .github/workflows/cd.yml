name: CD Terraform

on:
  workflow_run:
    workflows: [CI Terraform]   # ← attend la CI
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploiement:
    name: Application sur Azure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}   # ← seulement si elle a réussi
    environment: production     # ← met en pause

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Se connecter a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Recuperer l artefact du plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialiser le backend
        run: terraform init

      - name: Appliquer le plan valide
        run: terraform apply -auto-approve -input=false tfplan